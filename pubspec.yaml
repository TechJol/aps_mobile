name: aps_mobile
description: "Soft KG Pro Mobile Application"

publish_to: 'none'

version: 1.0.11+12

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -- Network -- #
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  xml: ^6.5.0

  # -- Bloc -- #
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  equatable: ^2.0.7
  dartz: ^0.10.1

  # -- Utils -- #
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  go_router: ^15.1.2

  # -- UI -- #

  auto_size_text: ^3.0.0
  dropdown_button2: ^2.3.9

  # -- Images -- #
  flutter_svg: ^2.1.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # -- Json -- #
  json_annotation: ^4.9.0
  json_serializable: ^6.9.5

  # -- Logger -- #
  logger: ^2.5.0
  flutter_image_compress: ^2.4.0
  dropdown_search: ^6.0.2
  fl_chart: ^1.0.0

  # -- Packages -- #
  aps_ci_keys:
    path: ./packages/aps_ci_keys
  decimal: ^3.2.4

  # -- Excel -- #
  excel: ^4.0.6
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  open_file: ^3.5.10
  share_plus: ^11.0.0

  # -- PDF -- #
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_secure_storage: ^9.2.4

  # -- Localization -- #
  flutter_localizations:
    sdk: flutter
  slang: ^4.8.1
  slang_flutter: ^4.8.0
  flutter_launcher_icons: ^0.14.4  
  in_app_update: ^4.2.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.10.0
  build_runner: ^2.4.15
  slang_build_runner: ^4.8.0

flutter_gen:
  output: lib/src/core/I10n/generated


flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/logotypenew.jpg"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/fonts/Roboto-Regular.ttf

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700


   