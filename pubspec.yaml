name: aps_mobile
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -- Network -- #
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3

  # -- Bloc -- #
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  equatable: ^2.0.7
  dartz: ^0.10.1

  # -- Utils -- #
  intl: ^0.20.2
  mask_text_input_formatter: ^2.9.0
  go_router: ^15.1.2

  # -- UI -- #
  auto_size_text: ^3.0.0

  # -- Images -- #
  flutter_svg: ^2.1.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # -- Json -- #
  json_annotation: ^4.9.0
  json_serializable: ^6.9.5

  # -- Logger -- #
  logger: ^2.5.0
  flutter_image_compress: ^2.4.0
  dropdown_search: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.10.0
  build_runner: ^2.4.15

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

